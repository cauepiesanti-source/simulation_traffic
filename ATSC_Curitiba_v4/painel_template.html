<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ATSC Curitiba v4</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:15px/1.5 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:24px}header{background:#0f172a;color:white;padding:26px;border-radius:14px}header small{color:#5eead4}h1{font-size:clamp(24px,4vw,38px);margin:5px 0}h2{font-size:20px;margin:0 0 10px}section{background:white;border:1px solid #dbe3ed;border-radius:12px;margin:14px 0;padding:18px}.muted,small{color:#64748b}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{background:#f8fafc}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:4px;font-weight:600}select{padding:8px;border:1px solid #cbd5e1;border-radius:6px;background:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.card{border:1px solid #e2e8f0;border-radius:8px;padding:12px}.bar{display:grid;grid-template-columns:22px 1fr 90px;align-items:center;gap:8px;margin:7px 0}.track{height:17px;background:#e2e8f0;border-radius:3px;overflow:hidden}.fill{height:100%}.warn{border-left:4px solid #ea580c;padding:9px;background:#fff7ed}.good{color:#0f766e}.bad{color:#b91c1c}svg{width:100%;height:auto;display:block}a{color:#0f766e}footer{color:#64748b;font-size:13px} @media(max-width:600px){main{padding:10px}section{padding:12px}}
</style></head><body><main><header><small>UTFPR · CIÊNCIAS DO AMBIENTE · ESTUDO EXPLORATÓRIO</small><h1>Semáforos adaptativos — ATSC v4.0</h1><p>Visconde de Guarapuava × Conselheiro Laurindo · SUMO + Python/TraCI</p></header><div id="app"></div><footer>Fontes: <a href="https://acervodigital.ufpr.br/handle/1884/85314">Pereda (UFPR, 2023)</a> · <a href="https://sumo.dlr.de/docs/Simulation/Traffic_Lights.html">SUMO: controle atuado</a> · <a href="https://sumo.dlr.de/docs/Simulation/RoadCapacity.html">Capacidade</a> · <a href="https://sumo.dlr.de/docs/Models/Emissions.html">Emissões</a> · <a href="https://www.oecd.org/en/publications/non-exhaust-particulate-emissions-from-road-transport_4a4dc6ca-en.html">OCDE 2020</a> · <a href="https://github.com/cauepiesanti-source/simulation_traffic">Repositório</a>.</footer></main><script>
const data=/*__DATA__*/null;
const $=id=>document.getElementById(id),fmt=(v,d=2)=>v==null||!Number.isFinite(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const names={A:'Fixo histórico',B:'Fixo otimizado',C:'Adaptativo original',D:'Adaptativo aprimorado',E:'Atuado com ciclo variável'},colors={A:'#64748b',B:'#2563eb',C:'#d97706',D:'#0d9488',E:'#7c3aed'},profiles={constante:'Constante',variavel:'Mudança de fluxo',ondas:'Ondas irregulares',pico:'Pico progressivo',pelotoes:'Pelotões'};
const metrics=[['atraso_medio_s','Atraso médio total','s'],['fila_media_veic','Fila média (inclui externa)','veíc.'],['co2_kg','CO₂ de escapamento','kg'],['combustivel_kg','Combustível','kg'],['atraso_L_s','Atraso na Laurindo','s'],['atraso_D_s','Atraso Visconde direita','s'],['atraso_E_s','Atraso Visconde esquerda','s'],['nox_g','NOx','g'],['pm_g','MP de escapamento','g'],['paradas_media','Paradas por veículo',''],['espera_entrada_s','Espera externa','s'],['pm10_nao_escape_g','PM10 não escapamento','g'],['energia_desaceleracao_MJ','Energia reduzida (proxy)','MJ'],['desaceleracoes_fortes_s_veic','Tempo de desaceleração forte','s/veíc.'],['ciclo_medio_s','Ciclo médio','s']];
function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function chart(series,unit,xmax=null){let vals=series.flatMap(s=>s.values).filter(p=>p[1]!=null&&Number.isFinite(p[1]));if(!vals.length)return '<p>Sem dados comparáveis.</p>';let maxX=xmax??Math.max(1,...vals.map(p=>p[0])),minX=xmax==null?Math.min(...vals.map(p=>p[0]),maxX):0;if(minX===maxX){minX-=.1;maxX+=.1}let minY=Math.min(0,...vals.map(p=>p[1])),maxY=Math.max(1,...vals.map(p=>p[1]));let x=v=>55+(v-minX)/(maxX-minX)*640,y=v=>200-(v-minY)/(maxY-minY)*175;let lines='';for(let i=0;i<=4;i++){let v=minY+(maxY-minY)*i/4;lines+=`<path d="M55 ${y(v)}H695" stroke="#e2e8f0"/><text x="50" y="${y(v)+4}" text-anchor="end" font-size="10">${fmt(v,1)}</text>`;let t=minX+(maxX-minX)*i/4;lines+=`<text x="${x(t)}" y="221" text-anchor="middle" font-size="10">${fmt(t,1)}</text>`}let paths=series.map(s=>{let p='',start=true,dots='';for(let [a,b] of s.values){if(b==null||!Number.isFinite(b)){start=true;continue}p+=`${start?'M':'L'}${x(a)} ${y(b)} `;start=false;dots+=`<circle cx="${x(a)}" cy="${y(b)}" r="2.5" fill="${s.color}"/>`}return `<path d="${p}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`}).join('');return `<svg viewBox="0 0 720 235" role="img" aria-label="Gráfico ${unit}">${lines}${paths}</svg><small>${unit} · ${series.map(s=>`<span style="color:${s.color};font-weight:bold">● ${s.label}</span>`).join(' &nbsp; ')}</small>`}
function bars(rows,k,label,u){let max=Math.max(1,...rows.map(r=>r[k]??0));return `<div class="card"><b>${label} (${u})</b>${rows.map(r=>`<div class="bar"><b>${r.cenario}</b><div class="track"><div class="fill" style="width:${(r[k]??0)/max*100}%;background:${colors[r.cenario]}"></div></div><span>${fmt(r[k])}</span></div>`).join('')}</div>`}
function render(){const d=data.escalas[+$('scale').value],m=d.meta,p=$('perfil').value,s=$('ctrl').value,k=$('metric').value,rows=d.resumo.filter(r=>r.perfil===p),met=metrics.find(a=>a[0]===k);$('info').textContent=`${m.sumo} · escala ${fmt(m.escala_demanda,1)} · sementes ${m.seeds.join(', ')} · treino ${m.seeds_treino.join(', ')} · B ${m.verde_B}/${77-m.verde_B} s · tau ${m.tau} s · minGap ${m.min_gap} m`;
$('bars').innerHTML=bars(rows,'atraso_medio_s','Atraso','s')+bars(rows,'co2_kg','CO₂','kg')+bars(rows,'atraso_L_s','Laurindo','s');$('detail').innerHTML=(rows.some(r=>!r.comparavel)?'<p class="warn">Há execuções inválidas; médias desses grupos foram suprimidas.</p>':'')+table(['Indicador',...rows.map(r=>r.cenario+' · '+r.n_validos+'/'+r.n)],[[ 'Veículos oferecidos',...rows.map(r=>fmt(r.oferecidos,0))],['Concluídos no horizonte',...rows.map(r=>fmt(r.concluidos_horizonte,0))],...metrics.map(([key,label,u])=>[label+(u?' ('+u+')':''),...rows.map(r=>fmt(r[key]))]),['DP atraso (s)',...rows.map(r=>fmt(r.atraso_medio_s_dp))],['Verde médio Visconde (s)',...rows.map(r=>fmt(r.verde_visconde_medio_s))],['Verde médio Laurindo (s)',...rows.map(r=>fmt(r.verde_laurindo_medio_s))]]);
let sens=data.sensibilidade;let series=Object.keys(names).map(c=>({label:c,color:colors[c],values:sens.filter(r=>r.cenario===c).sort((a,b)=>a.escala-b.escala).map(r=>[r.escala*100,r[k]])}));$('sensitivity').innerHTML=chart(series,`${met[1]} (${met[2]}) · demanda em % da referência`)+table(['Demanda','Controle','Média','Variação vs A'],sens.map(r=>[fmt(r.escala*100,0)+'%',r.cenario,fmt(r[k]),fmt(r[k+'_vs_A_pct'],1)+'%']));let base=rows.find(r=>r.cenario==='A'),comp=rows.find(r=>r.cenario===s);$('delta').innerHTML=metrics.slice(0,5).map(([key,label,u])=>{let v=base?.[key]>0&&comp?.[key]!=null?100*(comp[key]/base[key]-1):null;return `<div class="card"><small>${label}: ${s} × A</small><h2 class="${v==null?'':v<=0?'good':'bad'}">${v==null?'—':(v>0?'+':'')+fmt(v,1)+'%'}</h2></div>`}).join('');
let bins=m.perfis[p],dm=[],dl=[];bins.forEach(([a,b],i)=>{for(let t of [i,(i+1)]){dm.push([t*m.duracao_s/60/bins.length,3640*a*m.escala_demanda]);dl.push([t*m.duracao_s/60/bins.length,1400*b*m.escala_demanda])}});$('demand').innerHTML=chart([{label:'Visconde',color:'#2563eb',values:dm},{label:'Laurindo',color:'#d97706',values:dl}],'VPa/h · minutos',m.duracao_s/60);
let tr=d.series[p+'_'+s];$('trace').innerHTML=tr?chart([['fila_visconde','Visconde','#2563eb'],['fila_laurindo','Laurindo','#d97706'],['fila_externa','Externa','#64748b']].map(([key,label,color])=>({label,color,values:tr.fila.filter(x=>x.t<=m.duracao_s).map(x=>[x.t/60,x[key]])})),'Filas (veíc.) · minutos',m.duracao_s/60):'Sem série';if(tr?.fases){let end=Math.min(m.duracao_s,600),fs=tr.fases.filter(r=>r.t<end);$('trace').innerHTML+=`<h3>Primeiros ${end/60} minutos: fases reais</h3><svg viewBox="0 0 720 100">${fs.map(r=>{let x=50+r.t/end*650,w=(Math.min(end,r.fim)-r.t)/end*650;return `<rect x="${x}" y="15" width="${w}" height="24" fill="${r.fase==='MG'?'#0d9488':r.fase==='My'?'#eab308':'#dc2626'}"/><rect x="${x}" y="48" width="${w}" height="24" fill="${r.fase==='LG'?'#0d9488':r.fase==='Ly'?'#eab308':'#dc2626'}"/>`}).join('')}<text x="2" y="32" font-size="11">Visc.</text><text x="2" y="65" font-size="11">Laur.</text></svg>`} $('train').innerHTML=table(['Verde Visconde','Atraso médio','Válido'],m.treinamento.map(r=>[r.verde+' s',fmt(r.atraso),r.valido?'Sim':'Não']));}
if(!data||!data.escalas?.length){$('app').innerHTML='<section>Execute simular_atsc.py para gerar o painel com resultados reais.</section>'}else{$('app').innerHTML=`<section><h2>Controles e seleção</h2><p>A: histórico (45/32 s); B: fixo treinado; C: adaptativo original por ciclo; D: adaptativo com fila residual; E: atuado por segundo, ciclo variável. Verdes de 20–57 s em E, amarelo 4 s e vermelho integral 2 s. E usa observações presentes, não chegadas futuras.</p><div class="controls"><label>Demanda<select id="scale">${data.escalas.map((d,i)=>`<option value="${i}">${fmt(d.meta.escala_demanda*100,0)}%</option>`).join('')}</select></label><label>Perfil<select id="perfil">${Object.keys(data.escalas[0].meta.perfis).map(p=>`<option value="${p}">${profiles[p]}</option>`).join('')}</select></label><label>Controle<select id="ctrl">${Object.keys(names).map(c=>`<option ${c==='E'?'selected':''}>${c}</option>`).join('')}</select></label><label>Indicador de sensibilidade<select id="metric">${metrics.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label></div><p id="info" class="muted"></p><div id="demand"></div></section><section><h2>Ensaio de capacidade</h2><p>Descarga de filas previamente formadas, janela de 30 s após 10 s de verde. Referência de Pereda é estimativa, não medição de campo. Nenhum ajuste automático.</p>${data.capacidade?.length?table(['Aproximação','Ensaios válidos','SUMO (veíc./h)','Referência (VPa/h)','Desvio','Cap. nominal SUMO'],data.capacidade.map(r=>[r.grupo,r.n_validos+'/'+r.n,fmt(r.saturacao_sim_vph,0),fmt(r.saturacao_ref_vpa_h,0),fmt(r.desvio_pct,1)+'%',fmt(r.capacidade_nominal_sim_vph,0)])):'Ensaio omitido nesta execução.'}</section><section><h2>Sensibilidade à demanda</h2><p class="muted">Média com peso igual dos perfis executados; variação percentual negativa indica redução. Não é média diária nem previsão de crescimento.</p><div id="sensitivity"></div></section><section><h2>Comparação no perfil selecionado</h2><div id="delta" class="grid"></div><div id="bars" class="grid"></div><div id="detail"></div></section><section><h2>Comportamento temporal — primeira semente</h2><div id="trace"></div></section><section><h2>Treinamento do plano fixo B</h2><div id="train"></div></section><section><h2>Limitações</h2><p>Contagens curtas de 2022, perfis e multiplicadores hipotéticos, geometria de 2026 simplificada (3+3 e 3 faixas), somente movimentos em frente, sem pedestres, bloqueios a jusante ou calibração em campo. Frota equivalente a gasolina HBEFA3/PC_G_EU4; emissões de fila externa não contabilizadas. PM10 não escapamento por km (OCDE), sem modelo dinâmico de desgaste; energia de desaceleração não é energia dissipada nos freios. Resultados não demonstram superioridade estatística nem autorização para implantação. Não há comparação com planos fixos por horário.</p></section>`;for(let i of ['scale','perfil','ctrl','metric'])$(i).onchange=render;render()}
</script></body></html>
